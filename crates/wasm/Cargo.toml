[package]
name = "patches-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
patches-core = { path = "../core" }

# The renderer only builds for the browser; the pure modules are tested on the host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
three-d = { version = "0.19", default-features = false }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde_json = "1"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "HtmlElement", "Element", "WebGl2RenderingContext"] }
