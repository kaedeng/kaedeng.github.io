<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 3D Patches: an isometric cube tiled into pastel boxes, on the site's black. -->
  <rect width="32" height="32" rx="7" fill="#000"/>
  <!-- Top face: two boxes. -->
  <polygon points="16,3 27.25,9.5 21.625,12.75 10.375,6.25" fill="#f1b1b1"/>
  <polygon points="10.375,6.25 21.625,12.75 16,16 4.75,9.5" fill="#f1e9b1"/>
  <!-- Left face: two boxes, a little shaded. -->
  <polygon points="4.75,9.5 16,16 16,22.5 4.75,16.25" fill="#b1f1c4"/>
  <polygon points="4.75,16.25 16,22.5 16,29 4.75,23" fill="#d6b1f1"/>
  <polygon points="4.75,9.5 16,16 16,29 4.75,23" fill="#000" fill-opacity=".08"/>
  <!-- Right face: two boxes, more shaded. -->
  <polygon points="16,16 21.625,12.75 21.625,26 16,29" fill="#b1e6f1"/>
  <polygon points="21.625,12.75 27.25,9.5 27.25,23 21.625,26" fill="#b4b1f1"/>
  <polygon points="16,16 27.25,9.5 27.25,23 16,29" fill="#000" fill-opacity=".18"/>
  <!-- Gaps between boxes. -->
  <g stroke="#000" stroke-width="1.4" stroke-linecap="round">
    <line x1="10.375" y1="6.25" x2="21.625" y2="12.75"/>
    <line x1="4.75" y1="16.25" x2="16" y2="22.5"/>
    <line x1="21.625" y1="12.75" x2="21.625" y2="26"/>
    <line x1="4.75" y1="9.5" x2="16" y2="16"/>
    <line x1="16" y1="16" x2="27.25" y2="9.5"/>
    <line x1="16" y1="16" x2="16" y2="29"/>
  </g>
  <!-- The white lattice: a hairline silhouette with dots at its corners. -->
  <polygon points="16,3 27.25,9.5 27.25,23 16,29 4.75,23 4.75,9.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width=".6" stroke-linejoin="round"/>
  <g fill="#fff">
    <circle cx="16" cy="3" r=".7"/>
    <circle cx="27.25" cy="9.5" r=".7"/>
    <circle cx="27.25" cy="23" r=".7"/>
    <circle cx="16" cy="29" r=".7"/>
    <circle cx="4.75" cy="23" r=".7"/>
    <circle cx="4.75" cy="9.5" r=".7"/>
  </g>
</svg>
